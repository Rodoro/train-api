version: '3.7'

services:
  db:
    container_name: postgres-train
    image: postgres:15.2
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - backend-train

volumes: 
  postgres_data:

networks:
  backend-train: